name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  # The release workflow runs the same checks on the tagged commit before it publishes anything.
  workflow_call:
    inputs:
      skip_image:
        description: Skip the image job (the release workflow builds, tests and publishes its own images).
        type: boolean
        default: false

permissions:
  contents: read

# github.workflow keeps the release workflow's call of these checks (on master) out of the group of the
# ordinary master CI run, so neither cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ui
      - name: No secrets or personal data in the tree
        run: scripts/check-tree.sh

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Builds the image natively on amd64 and arm64 (the Raspberry Pi target), runs the container smoke test,
  # and upgrades the newest published release to it (scripts/container-upgrade.sh).
  # Nothing is pushed: publishing an image happens only in the release workflow.
  image:
    if: ${{ !inputs.skip_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build image (${{ matrix.arch }})
        run: docker build -t workspace-mcp:local .
      - name: Check architecture
        run: test "$(docker image inspect -f '{{.Architecture}}' workspace-mcp:local)" = "${{ matrix.arch }}"
      - name: Container smoke test
        run: scripts/container-smoke.sh workspace-mcp:local
      - name: Registry lookup used by the release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAGS="$(scripts/ghcr.sh tags "$GITHUB_REPOSITORY")"
          echo "ghcr.io/${GITHUB_REPOSITORY,,} has $(grep -c . <<<"$TAGS" || true) tag(s)"
      - name: Find the release to upgrade from
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          RELEASED="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName')"
          PREVIOUS="$(node scripts/release-version.ts previous "$VERSION" <<<"$RELEASED")"
          echo "tag=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          if [ -z "$PREVIOUS" ]; then
            echo "::notice::No published release up to ${VERSION} yet, so there is nothing to upgrade from: upgrade test skipped."
          fi
      - name: Upgrade test from ${{ steps.previous.outputs.tag || 'the previous release' }}
        if: steps.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${PREVIOUS}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "$IMAGE"
          scripts/container-upgrade.sh "$IMAGE" workspace-mcp:local
