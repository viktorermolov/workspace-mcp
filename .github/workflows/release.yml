name: release

# Runs only when the owner pushes a version tag vX.Y.Z on a commit from master. In order:
#   guard    the tag is vX.Y.Z on a commit from master, matches package.json, has CHANGELOG notes, and the
#            version is not released or in the registry yet; decides whether it becomes `latest`
#   ci       the full CI (typecheck, unit tests, UI build, tree check, e2e) on the same commit
#   build    per architecture: builds the image with SBOM and provenance, pushes it by digest (no tag),
#            then pulls exactly that digest and runs the smoke test and the upgrade test from the previous release
#   publish  joins the tested digests into one multi-arch index, uploads it by digest (no tag), checks the
#            platforms, SBOM and provenance, signs it with cosign (keyless) and verifies the signature; only
#            then tags it vX.Y.Z and X.Y.Z, and `latest` only when this is the highest version
#   release  creates the GitHub Release with the notes from CHANGELOG.md
# Nothing is tagged in the registry until every check has passed and the image is signed.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One release at a time, so the `latest` decision sees the releases before it. A running release is never
# cancelled; if several tags are pushed while one runs, GitHub keeps only the newest waiting run and cancels
# the others, which then publish nothing and need a re-run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      previous: ${{ steps.check.outputs.previous }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check the tag, the commit, the version and the release notes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          node scripts/release-version.ts check "$TAG" || fail "Release tags have the form vX.Y.Z; ${TAG} is not one."
          COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [ "$COMMIT" = "$GITHUB_SHA" ] || fail "The tag points to ${COMMIT}, but this run is for ${GITHUB_SHA}."
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master \
            || fail "${GITHUB_SHA} is not a commit on master. Tag a commit from master."
          VERSION="$(node -p 'require("./package.json").version')"
          [ "v${VERSION}" = "$TAG" ] || fail "package.json has version ${VERSION}, the tag is ${TAG}."
          LOCK="$(node -p 'const l=require("./package-lock.json"); l.version + " " + l.packages[""].version')"
          [ "$LOCK" = "${VERSION} ${VERSION}" ] || fail "package-lock.json has version ${LOCK}, expected ${VERSION}."
          node scripts/release-version.ts notes "$VERSION" >/dev/null \
            || fail "CHANGELOG.md has no section \"## [${VERSION}]\" with release notes."
          ALL="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -qxF "$TAG" <<<"$ALL"; then
            fail "A GitHub Release ${TAG} already exists. A published version is never rebuilt; release a new version."
          fi
          RELEASED="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName')"
          # Versions already tagged in the registry count too, so a release that published its image but not
          # its GitHub Release still keeps an older version from taking `latest`.
          REGISTRY_TAGS="$(scripts/ghcr.sh tags "$GITHUB_REPOSITORY")"
          for T in "$TAG" "$VERSION"; do
            if grep -qxF "$T" <<<"$REGISTRY_TAGS"; then
              fail "ghcr.io/${GITHUB_REPOSITORY,,}:${T} is already in the registry. A published version is never rebuilt."
            fi
          done
          PREVIOUS="$(node scripts/release-version.ts previous "$VERSION" <<<"$RELEASED")"
          LATEST="$(printf '%s\n%s\n' "$RELEASED" "$REGISTRY_TAGS" | node scripts/release-version.ts is-highest "$VERSION")"
          {
            echo "version=${VERSION}"
            echo "previous=${PREVIOUS}"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} from ${GITHUB_SHA}: upgrade test from ${PREVIOUS:-nothing (first release)}, latest=${LATEST}."

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      skip_image: true
    permissions:
      contents: read
      packages: read

  build:
    needs: [guard, ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      PREVIOUS: ${{ needs.guard.outputs.previous }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Build and push by digest, without a tag, with SBOM and provenance
        id: build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform "linux/${ARCH}" \
            --sbom=true --provenance=mode=max \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${RUNNER_TEMP}/build.json" .
          DIGEST="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/build.json")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest in the build metadata"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST} for linux/${ARCH}"
      - name: Pull exactly the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" workspace-mcp:release
          test "$(docker image inspect -f '{{.Architecture}}' workspace-mcp:release)" = "${ARCH}"
          test "$(docker run --rm workspace-mcp:release cli version | tr -d '[:space:]')" = "${VERSION}" \
            || { echo "::error::the image does not report version ${VERSION}"; exit 1; }
      - name: Container smoke test
        run: scripts/container-smoke.sh workspace-mcp:release
      - name: Upgrade test from ${{ needs.guard.outputs.previous || 'the previous release' }}
        if: needs.guard.outputs.previous != ''
        run: |
          OLD="ghcr.io/${GITHUB_REPOSITORY,,}:${PREVIOUS}"
          docker pull "$OLD"
          scripts/container-upgrade.sh "$OLD" workspace-mcp:release
      - name: No previous release
        if: needs.guard.outputs.previous == ''
        run: echo "::notice::No published release up to ${VERSION}, so there is nothing to upgrade from; upgrade test skipped."
      - name: Record the tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$DIGEST" > "${RUNNER_TEMP}/digest-${ARCH}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    outputs:
      digest: ${{ steps.tags.outputs.digest }}
      latest: ${{ steps.tags.outputs.latest }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Upload the multi-arch index by digest, without a tag
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SOURCES=()
          for ARCH in amd64 arm64; do
            D="$(cat "${RUNNER_TEMP}/digests/digest-${ARCH}")"
            [[ "$D" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest for ${ARCH}"; exit 1; }
            SOURCES+=("${IMAGE}@${D}")
          done
          docker buildx imagetools create --dry-run "${SOURCES[@]}" > "${RUNNER_TEMP}/index.json"
          DIGEST="$(scripts/ghcr.sh put-index "$GITHUB_REPOSITORY" "${RUNNER_TEMP}/index.json")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no index digest"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
      - name: Check platforms, SBOM and provenance
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          RAW="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          PLATFORMS="$(jq -r '[.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")' <<<"$RAW")"
          [ "$PLATFORMS" = "linux/amd64,linux/arm64" ] || { echo "::error::unexpected platforms: ${PLATFORMS}"; exit 1; }
          ATTESTATIONS="$(jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' <<<"$RAW")"
          [ "$(grep -c . <<<"$ATTESTATIONS" || true)" -eq 2 ] || { echo "::error::expected one attestation manifest per platform"; exit 1; }
          for A in $ATTESTATIONS; do
            TYPES="$(docker buildx imagetools inspect --raw "${IMAGE}@${A}" | jq -r '[.layers[].annotations["in-toto.io/predicate-type"]] | join(" ")')"
            grep -q 'spdx' <<<"$TYPES" || { echo "::error::no SBOM in ${A}: ${TYPES}"; exit 1; }
            grep -q 'slsa.dev/provenance' <<<"$TYPES" || { echo "::error::no provenance in ${A}: ${TYPES}"; exit 1; }
          done
          echo "SBOM and provenance attached for both platforms"
      - name: Sign the image (keyless) and verify the signature
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The index is what `docker pull` of a tag resolves to; signing only it keeps the registry free of
          # extra signature tags for each platform and attestation manifest.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" >/dev/null
          echo "Signed and verified ${IMAGE}@${DIGEST}"
      - name: Tag the signed image
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          check() {
            local GOT
            GOT="$(docker buildx imagetools inspect "${IMAGE}:$1" --format '{{json .Manifest}}' | jq -r .digest)"
            [ "$GOT" = "$DIGEST" ] || { echo "::error::${IMAGE}:$1 points to ${GOT}, not the signed ${DIGEST}"; exit 1; }
          }
          # Decided again here, not taken from the guard: a re-run of failed jobs reuses the guard's outputs,
          # and a newer version may have been released since.
          EXISTING="$(scripts/ghcr.sh tags "$GITHUB_REPOSITORY")"
          for T in "$TAG" "$VERSION"; do
            if grep -qxF "$T" <<<"$EXISTING"; then echo "::error::${IMAGE}:${T} appeared in the registry during this run"; exit 1; fi
          done
          RELEASED="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName')"
          LATEST="$(printf '%s\n%s\n' "$RELEASED" "$EXISTING" | node scripts/release-version.ts is-highest "$VERSION")"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" -t "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"
          check "$TAG"
          check "$VERSION"
          # latest moves last, in its own step, only once the version tags are in place.
          if [ "$LATEST" = "true" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
            check latest
          else
            echo "::notice::${VERSION} is not the highest released version, so latest stays where it is."
          fi
          {
            echo "digest=${DIGEST}"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}@${DIGEST} as ${TAG}, ${VERSION}$([ "$LATEST" = "true" ] && echo ', latest')"

  release:
    needs: [guard, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      LATEST: ${{ needs.publish.outputs.latest }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOW="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          [ "$NOW" = "$GITHUB_SHA" ] || { echo "::error::the tag ${TAG} now points to ${NOW}, not ${GITHUB_SHA}"; exit 1; }
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          NOTES="${RUNNER_TEMP}/notes.md"
          {
            node scripts/release-version.ts notes "$VERSION"
            echo
            echo "### Container image"
            echo
            echo "For linux/amd64 and linux/arm64, signed with cosign (keyless, from this workflow), with SBOM and provenance attached."
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "cosign verify --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } > "$NOTES"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$NOTES" --latest="$LATEST"
