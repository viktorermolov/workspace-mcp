# Workspace MCP with Docker Compose. Copy .env.example to .env and fill it in first.
# The service listens only on 127.0.0.1: put a tunnel or reverse proxy with https in front of it
# (see docs/deployment.md). The optional cloudflared service below is one way to do that.
services:
  workspace:
    image: ${WORKSPACE_IMAGE:-workspace-mcp:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - workspace-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional: a Cloudflare Tunnel that publishes the service without opening ports.
  # Start with: docker compose --profile tunnel up -d   (needs CLOUDFLARED_TOKEN in .env)
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      workspace:
        condition: service_healthy

volumes:
  # A named volume keeps file ownership right for the non-root user in the image.
  # Copy backups out with: docker compose cp workspace:/data/backups ./backups
  workspace-data:
